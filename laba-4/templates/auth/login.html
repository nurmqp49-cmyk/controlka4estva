{% extends "base.html" %}
{% block title %}Вход — TicketBook{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2 class="auth-title">Войти в систему</h2>
    <p class="auth-sub">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрируйтесь</a></p>

    <form method="post" class="auth-form">
      <label>Email
        <input type="email" name="email" placeholder="user@ticketbook.kz" required>
      </label>
      <label>Пароль
        <input type="password" name="password" placeholder="••••••••" required>
      </label>
      <button type="submit" class="btn-primary btn-full">Войти</button>
    </form>

    <div class="auth-hint">
      <p><strong>Тестовые данные:</strong></p>
      <p>Пользователь: <code>user@ticketbook.kz</code> / <code>user123</code></p>
      <p>Админ: <code>admin@ticketbook.kz</code> / <code>admin123</code></p>
    </div>
  </div>
</div>
{% endblock %}
